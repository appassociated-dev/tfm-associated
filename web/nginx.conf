# =============================================================
# Associated Web — Configuracion nginx para contenedor Docker
# Sirve la SPA (React + Vite) con enrutamiento client-side.
# =============================================================

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Compresion gzip ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # --- Cache de assets estaticos (hashed por Vite) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # --- Healthcheck para Docker ---
    location /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # --- SPA fallback: enrutamiento client-side ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
