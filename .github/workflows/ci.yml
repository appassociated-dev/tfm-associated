# Pipeline CI para Associated
# Ejecuta lint, typecheck, tests unitarios y build para backend y frontend
# Los tests E2E se ejecutan tras los jobs de backend y frontend

name: CI

on:
  push:
    branches:
      - main
      - 'mvp/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (API)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run -w api prisma:generate
        env:
          DATABASE_MAIN_URL: postgresql://dummy:dummy@localhost:5432/dummy
          DATABASE_TENANT_URL: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Lint
        run: npm run -w api lint

      - name: Typecheck
        run: npx -w api tsc --noEmit

      - name: Unit tests
        run: npm run -w api test:unit -- --coverage

  frontend:
    name: Frontend (Web)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run -w web lint

      - name: Typecheck
        run: npm run -w web typecheck

      - name: Unit tests
        run: npm run -w web test -- --coverage

      - name: Build
        run: npm run -w web build

  backend-e2e:
    name: Backend E2E Tests
    runs-on: ubuntu-latest
    needs: [backend]

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: associated
          POSTGRES_PASSWORD: associated_dev
          POSTGRES_DB: associated_main
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U associated -d associated_main"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_MAIN_URL: postgresql://associated:associated_dev@localhost:5432/associated_main?schema=public
      DATABASE_TENANT_URL: postgresql://associated:associated_dev@localhost:5432/associated_tenant_template?schema=public
      JWT_SECRET: ci-test-secret
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      ENCRYPTION_KEY: '0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef'
      SUPERADMIN_API_KEY: ci-e2e-superadmin-key
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup PostgreSQL extensions
        run: |
          psql "$DATABASE_MAIN_URL" -c "CREATE EXTENSION IF NOT EXISTS \"uuid-ossp\";"
          psql "$DATABASE_MAIN_URL" -c "CREATE EXTENSION IF NOT EXISTS \"pg_trgm\";"
          psql "$DATABASE_MAIN_URL" -c "CREATE EXTENSION IF NOT EXISTS \"pgcrypto\";"

      - name: Create tenant template database
        run: psql "$DATABASE_MAIN_URL" -c "CREATE DATABASE associated_tenant_template OWNER associated;"

      - name: Generate Prisma clients
        run: npm run -w api prisma:generate

      - name: Run migrations (main)
        run: npx -w api prisma migrate deploy --config=prisma/main/prisma.config.ts

      - name: Run migrations (tenant template)
        run: npx -w api prisma migrate deploy --config=prisma/tenant/prisma.config.ts

      - name: Run backend E2E tests
        run: npm run -w api test:e2e

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-e2e-report
          path: api/test-results/
          retention-days: 7

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: false # Skip: no E2E tests implemented yet

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx -w e2e playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run -w e2e test
        env:
          CI: true

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
