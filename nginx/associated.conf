# =============================================================
# Associated — Configuracion nginx del host (reverse proxy + SSL)
#
# Ubicacion en el VPS: /etc/nginx/sites-available/associated.conf
# Activar: ln -s /etc/nginx/sites-available/associated.conf /etc/nginx/sites-enabled/
# Recargar: sudo nginx -t && sudo nginx -s reload
#
# Reemplazar ${DOMAIN} por el dominio real antes de activar.
# Certificados SSL en /etc/ssl/associated/ (certbot o manuales).
# =============================================================

# --- Redireccion HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name ${DOMAIN};

    # Permitir verificacion de certbot (ACME challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirigir todo el trafico a HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Servidor HTTPS principal ---
server {
    #
    # Sobre http2 on; como directiva separada se introdujo en nginx 1.25+. 
    # En versiones anteriores, HTTP/2 se activa en la directiva listen.
    # * nginx 1.25+
    #     listen 443 ssl;
    #     listen [::]:443 ssl;
    #     http2 on;
    # * nginx < 1.25
    #     listen 443 ssl http2;
    #     listen [::]:443 ssl http2;
    #
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ${DOMAIN};

    # --- Certificados SSL ---
    ssl_certificate     /etc/ssl/associated/fullchain.pem;
    ssl_certificate_key /etc/ssl/associated/privkey.pem;

    # --- Protocolos y cifrados (TLS 1.2+ unicamente) ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # --- Sesion SSL ---
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- OCSP Stapling ---
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Cabeceras de seguridad ---
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Limites del cuerpo de la peticion ---
    client_max_body_size 10m;

    # --- Proxy a la API (contenedor api en puerto 3000) ---
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Cabeceras de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSocket (si fuese necesario en el futuro)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # No buffering para respuestas de la API
        proxy_buffering off;
    }

    # --- Proxy al frontend (contenedor web en puerto 8080) ---
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Cabeceras de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --- Pagina de error personalizada (opcional) ---
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
